<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F1">
<title>拾货 SHIHUO · 智能进销存协同</title>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="sb-brand" id="wsSwitch" title="切换工作空间">
      <span class="sb-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <rect x="3" y="6" width="2.6" height="20" rx="1.3" fill="currentColor"/>
          <rect x="8" y="6" width="1.6" height="20" rx="0.8" fill="currentColor"/>
          <rect x="12" y="6" width="3.4" height="20" rx="1.7" fill="currentColor"/>
          <rect x="18" y="6" width="1.6" height="20" rx="0.8" fill="currentColor"/>
          <rect x="22" y="6" width="2.6" height="20" rx="1.3" fill="currentColor"/>
          <rect x="27" y="6" width="1.6" height="20" rx="0.8" fill="currentColor"/>
        </svg>
      </span>
      <span class="sb-text">
        <strong id="wsName">拾货</strong>
        <span id="wsType">选择工作空间</span>
      </span>
      <span class="sb-caret" data-icon="down"></span>
    </button>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <div class="side-foot">
      <button class="side-scan" id="sideScan">
        <span class="side-scan-ico" data-icon="scan"></span>
        <span>
          <b>开始扫码作业</b>
          <i>条码 / 单据 / 拍照</i>
        </span>
      </button>
      <div class="side-user">
        <div class="avatar sm">林</div>
        <div class="side-user-t">
          <b>林知夏</b>
          <i>店长 · 运营</i>
        </div>
        <button class="icon-btn xs" data-act="logout" aria-label="退出">⏻</button>
      </div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button class="icon-btn only-m" id="menuBtn" aria-label="打开导航"><span data-icon="menu"></span></button>
      <div class="top-title">
        <h1 id="pageTitle">工作台</h1>
        <p id="pageSub" class="top-sub"></p>
      </div>
      <div class="top-actions">
        <label class="search" id="searchWrap">
          <span data-icon="search"></span>
          <input id="q" type="search" placeholder="搜索商品 / 单据 / 条码" autocomplete="off">
          <kbd class="only-d">⌘K</kbd>
        </label>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题"><span data-icon="moon"></span></button>
        <button class="icon-btn" id="bellBtn" aria-label="通知">
          <span data-icon="bell"></span><i class="dot"></i>
        </button>
        <div class="avatar only-d" title="林知夏">林</div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="快捷导航">
  <a href="#/dashboard" data-tab="dashboard"><span data-icon="dashboard"></span><i>工作台</i></a>
  <a href="#/inventory" data-tab="inventory"><span data-icon="box"></span><i>库存</i></a>
  <a href="#/scan" class="tab-scan" data-tab="scan"><span class="tab-scan-btn"><span data-icon="scan"></span></span><i>扫码</i></a>
  <a href="#/docs" data-tab="docs"><span data-icon="doc"></span><i>单据</i></a>
  <button id="moreBtn" data-tab="more"><span data-icon="more"></span><i>更多</i></button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="layer" id="layer" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/vendor/html5-qrcode.min.js"></script>
<script src="assets/js/templates.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/app.js"></script></body>
</html>
